<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PCO Prime Sync</title>
    <!--
      Watchdog: a plain classic script so it runs even when the module bundle is
      rejected by the browser (Safari is strict, and a parse error there leaves a
      titled blank page with nothing to report). It only speaks up if the app
      rendered nothing, and it names the error instead of guessing.
    -->
    <script>
      (function () {
        var problems = [];
        var probes = [];

        // A script error event carries no status, so ask the server directly.
        // "Failed to load /main.tsx (status unavailable)" is unactionable; the
        // answer, the content type and the port are not.
        function describe(src) {
          probes.push(
            fetch(src, { cache: 'no-store' })
              .then(function (response) {
                var type = response.headers.get('content-type') || 'no content type';
                var line =
                  'Failed to load ' + src + ' (HTTP ' + response.status + ', ' + type + ')';
                if (response.status >= 400) {
                  return line + ' — the server has no such file. Restart `npm run dev` and reload.';
                }
                if (type.indexOf('html') !== -1) {
                  return (
                    line +
                    ' — the server answered with the HTML page instead of JavaScript, so whatever is on this port does not compile .tsx. Stop it and start `npm run dev`, which puts Vite on port 3000.'
                  );
                }
                if (type.indexOf('javascript') === -1 && type.indexOf('ecmascript') === -1) {
                  return (
                    line +
                    ' — served as ' +
                    type +
                    ' instead of JavaScript, so the browser refused it. That process is serving the folder as plain files; stop it and start `npm run dev`.'
                  );
                }
                // Delivered correctly, so the failure is either the module
                // itself or a stale cached copy of it. Ask for it again under a
                // URL no cache can have an entry for: if that works, the cache
                // is the problem, and if it does not, the error says why.
                var fresh =
                  src + (src.indexOf('?') === -1 ? '?' : '&') + 'fresh=' + Date.now();
                return import(fresh).then(
                  function () {
                    return (
                      line +
                      ' — but the same module loads fine when requested fresh, so this browser is reusing a cached older copy of it. Clear the cached data for this origin (Safari: Settings → Privacy → Manage Website Data → remove 127.0.0.1, or Develop → Empty Caches) and reload.'
                    );
                  },
                  function (error) {
                    return (
                      line +
                      ' — and importing it fresh failed too: ' +
                      ((error && error.message) || String(error)) +
                      '. The browser console has the full stack.'
                    );
                  },
                );
              })
              .catch(function (error) {
                return (
                  'Failed to load ' +
                  src +
                  ' (no response: ' +
                  ((error && error.message) || 'network error') +
                  ')'
                );
              }),
          );
        }

        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target.tagName === 'SCRIPT') {
            if (target.src) describe(target.src);
            else problems.push('Failed to load an inline script');
            return;
          }
          problems.push(
            (event.message || 'Script error') +
              (event.filename ? ' — ' + event.filename + ':' + (event.lineno || 0) : ''),
          );
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          problems.push('Unhandled rejection: ' + ((reason && reason.message) || String(reason)));
        });

        function render() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          var box = document.createElement('div');
          box.style.cssText =
            'font:14px/1.6 system-ui,-apple-system,sans-serif;margin:48px auto;max-width:680px;padding:24px;' +
            'border:1px solid #b42318;border-radius:10px;color:#111;background:#fff';
          var heading = document.createElement('h1');
          heading.textContent = 'PCO Prime Sync could not start in this browser';
          heading.style.cssText = 'font-size:18px;margin:0 0 10px';
          var body = document.createElement('p');
          body.style.cssText = 'margin:0 0 10px';
          body.textContent =
            'The page loaded, but its JavaScript did not run. This is usually a stale build (run `npm run build` or restart `npm run dev` and reload) or a browser that cannot parse the bundle.';
          var details = document.createElement('pre');
          details.style.cssText = 'white-space:pre-wrap;font-size:12px;color:#b42318;margin:0';
          details.textContent =
            'Browser: ' + navigator.userAgent + '\nURL: ' + location.href + '\n' +
            (problems.length ? problems.join('\n') : 'No script error was reported.');
          box.append(heading, body, details);
          root.replaceChildren(box);
        }

        function report() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          if (probes.length === 0) {
            render();
            return;
          }
          // Wait for the probes so the message can state the real status.
          Promise.all(probes).then(function (lines) {
            problems = problems.concat(lines);
            render();
          });
        }

        // Give the module time to boot, then report only if nothing rendered.
        window.addEventListener('load', function () {
          setTimeout(report, 4000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
